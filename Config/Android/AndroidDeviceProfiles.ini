; Android-only device profile overrides. Every Android_* tier inherits from [Android DeviceProfile]
; (BaseProfileName=Android in the engine's BaseDeviceProfiles.ini), so settings here reach every phone.

; Texture budget. The cooker strips every mip above MaxLODSize from the Android build only; source textures and
; desktop builds keep their full resolution. The StylizedNewYorkCity textures are 2K, so 1024 cuts their cooked size
; (and GPU memory) by ~75%. Same cap as the Wasm build (Platforms/Wasm/Config/WasmDeviceProfiles.ini).
[Android DeviceProfile]
+TextureLODGroups=(Group=TEXTUREGROUP_World,MinLODSize=1,MaxLODSize=1024,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_WorldNormalMap,MinLODSize=1,MaxLODSize=1024,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_WorldSpecular,MinLODSize=1,MaxLODSize=1024,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_Character,MinLODSize=1,MaxLODSize=1024,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_CharacterNormalMap,MinLODSize=1,MaxLODSize=1024,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_CharacterSpecular,MinLODSize=1,MaxLODSize=1024,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
; Cap at 60 FPS: 90/120 Hz phones would otherwise render every refresh, overheat and throttle mid-session.
+CVars=t.MaxFPS=60
; Both cafe maps have a SkyLight with Real Time Capture on, which re-renders the sky cubemap continuously.
; The sky is static, so phones use the one capture taken at load instead.
+CVars=r.SkyLight.RealTimeReflectionCapture=0
; The sun's dynamic shadow distance is 400 m (4 cascades) in both cafe maps, which spreads the phone's 1-2
; cascades over a huge area and draws every caster in it. 0.1 = 40 m: the cafe and the street outside the windows.
+CVars=r.Shadow.DistanceScale=0.1

; Low-end phones: 30 FPS for steady pacing, no MSAA, and a smaller render target.
[Android_Low DeviceProfile]
+CVars=t.MaxFPS=30
+CVars=r.MSAACount=1
+CVars=r.MobileContentScaleFactor=0.7
; Switch the cafe props (tables 41k tris, lamps 32k, plate sets 55k at LOD0) to their lower LODs at half the distance.
+CVars=r.StaticMeshLODDistanceScale=2

; Mid tier (also every unrecognised phone, via Android_Default): one shadow cascade and 2x MSAA instead of 4x.
[Android_Mid DeviceProfile]
+CVars=r.Shadow.CSM.MaxMobileCascades=1
+CVars=r.MSAACount=2
+CVars=r.StaticMeshLODDistanceScale=1.5

; ---- Meta Quest (vr branch) ----
; Every Quest profile (Oculus_Quest2, Meta_Quest_3/3S/Pro) inherits Android_OpenXR -> Android_Mid -> Android, so the
; phone settings above reach the headset. Undo the ones that hurt VR:
[Android_OpenXR DeviceProfile]
; No 60 FPS cap: the OpenXR runtime paces frames to the display (72 Hz on Quest 2). A 60 cap would judder.
+CVars=t.MaxFPS=0
; 4x MSAA (Meta's recommended VR anti-aliasing; Android_Mid sets 2x for phones).
+CVars=r.MSAACount=4
; Fixed foveated rendering through XR_FB_foveation: 2 = medium. Lowers the pixel cost at the lens edges.
+CVars=xr.OpenXRFBFoveationLevel=2
+CVars=xr.OpenXRFBFoveationDynamic=1
; One shadow cascade, close range (the cafe interior).
+CVars=r.Shadow.CSM.MaxMobileCascades=1
