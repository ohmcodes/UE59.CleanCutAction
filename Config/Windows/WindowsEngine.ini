; Windows-only overrides ("Go Big" RTX build). Settings here don't affect the Wasm, Linux or Android builds.
; See Docs/PackagingGuide/01_Windows.md and Docs/Submission/NVIDIA_RTX_Award.md.
; Changing r.RayTracing or r.Lumen.HardwareRayTracing recompiles Windows shaders and needs an editor restart.

[/Script/Engine.RendererSettings]
; DefaultEngine.ini has r.AntiAliasingMethod=0 (no AA) from the template. TSR on desktop (DLSS replaces it once the plugin is in).
r.AntiAliasingMethod=4

; Hardware ray tracing. GPUs without ray tracing fall back to software Lumen automatically.
r.RayTracing=True
; Keep Virtual Shadow Maps for shadows; ray-traced shadows cost more for little gain here.
r.RayTracing.Shadows=False
; Lumen GI and reflections traced against the real scene instead of distance fields.
r.Lumen.HardwareRayTracing=True
; 2 = hit lighting for reflections: full material + lighting at each reflection hit (sharper glass/glossy reflections).
r.Lumen.HardwareRayTracing.LightingMode=2
; Lumen reflections on the front layer of translucent surfaces (cafe windows, glasses).
r.Lumen.TranslucencyReflections.FrontLayer.EnableForProject=True

; Default bloom for cameras and volumes that don't set it themselves. Makes the emissive tape marks and lamps glow.
r.DefaultFeature.Bloom=True
