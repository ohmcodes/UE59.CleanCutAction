; Web-only overrides. Config/DefaultEngine.ini loads after the engine's BaseWasmEngine.ini, so the mobile
; settings there (MSAA, which the web's deferred tier cannot do) would replace the web defaults. This file loads last
; for the Wasm platform and puts the web renderer settings back.
[/Script/Engine.RendererSettings]
r.Mobile.ShadingPath=0
r.Mobile.AntiAliasing=1
r.MobileHDR=True
r.Mobile.SupportGPUScene=True
r.Shadow.CSM.MaxMobileCascades=2
; No hardware occlusion culling on the web. The browser returns query results 4-6 frames late, so the engine reads them
; 8 frames later (BaseWasmEngine.ini, r.NumBufferedOcclusionQueries=8). When the camera moves, a mesh that was hidden
; behind a wall or counter stays culled until its stale result clears, so props blink out for about 8 frames and pop back.
; The cafe is a small interior where occlusion culls little, so the extra draws cost less than the popping.
r.AllowOcclusionQueries=False
